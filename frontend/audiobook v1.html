<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook Library</title>
    <style>
        nav {
            background-color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
        }
        .logoimg {
            width: 35px;
            height: 35px;
            object-fit: contain;
            margin-right: 10px;
        }
        .title {
            font-weight: bold;
            color: #ffffff;
            margin-right: auto;
        }
        .navlinks {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }
        .navlinks a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s;
        }
         .navlinks a:hover {
      color: #1d61b9;
    }
    .pagetitle {
      text-align: center;
      margin-top: 2rem;
      font-size: 2rem;
    }
    .appcontainer {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 3rem;
      padding: 2rem;
      flex-wrap: wrap;
    }
    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #181818;
      padding: 2rem;
      border-radius: 12px;
      width: 320px;
      position: relative;
    }
    .nowplaying {
      margin-bottom: 1rem;
      font-size: 1.1rem;
      font-weight: bold;
      color: #1d61b9;
      text-align: center;
    }
    .turntable {
      position: relative;
      width: 220px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .record {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle,
        #111,
        #111 2px,
        #222 3px,
        #222 4px
      );
      border: 4px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .recordcenter {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2px solid #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1d61b9;
    }
    .recordcenter img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tonearm {
      position: absolute;
      top: 10px;
      right: 15px;
      width: 60px;
      height: 100px;
      pointer-events: none;
    }
    .tonearmbase {
      position: absolute;
      top: 0;
      right: 0;
      width: 16px;
      height: 16px;
      background: #666;
      border-radius: 50%;
      border: 2px solid #333;
    }
    .tonearmstick {
      position: absolute;
      top: 8px;
      right: 6px;
      width: 4px;
      height: 80px;
      background: #888;
      transform-origin: top center;
      transform: rotate(-25deg);
      border-radius: 2px;
    }
    .tonearmhead {
      position: absolute;
      bottom: -4px;
      left: -4px;
      width: 12px;
      height: 18px;
      background: #444;
      border-radius: 2px;
    }
    .progress {
      width: 100%;
      margin-top: 1.5rem;
    }
    .progressbar {
      width: 100%;
      accent-color: #1d61b9;
      cursor: pointer;
    }
    .timestamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 0.2rem;
    }
    .chapterselect {
      width: 100%;
      margin-top: 1rem;
      padding: 0.5rem;
      background: #282828;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      align-items: center;
    }
    .controls button {
      background-color: #1d61b9;
      border: none;
      color: #000;
      padding: 0.6rem 1rem;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .library {
      background: #181818;
      padding: 1.5rem;
      border-radius: 12px;
      width: 320px;
      max-height: 480px;
      display: flex;
      flex-direction: column;
    }
    .library h3 {
      margin-top: 0;
      margin-bottom: 0.8rem;
    }
    .searchbar {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 1rem;
      background: #282828;
      border: 1px solid #444;
      border-radius: 6px;
      color: #ffffff;
      box-sizing: border-box;
    }
    .booklist {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .bookitem {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem;
      background: #282828;
      border-radius: 6px;
      cursor: pointer;
    }
    .bookinfo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .favbtn {
      background: none;
      border: none;
      color: #888;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .favbtn:hover {
      color: #1d61b9;
    }
  </style>
</head>
<body>
     <nav>
    <img src = "" alt="logo" class="logoimg">
    <span class="title">Virtual Hugs</span>
    <ul class="navlinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">Kindness Wall</a></li>
        <li><a href="#">Minigames</a></li>
        <li><a href="#">Audiobooks</a></li>
        <li><a href="#">Guildlines</a></li>
        <li><a href="#">Affirmations</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Breathing Exercises & Mindfulness</a></li>
    </ul>
  </nav>

  <h1 class="pagetitle">Audiobook Library</h1>

  <div class="appcontainer">
    <div class="player">
      <div class="nowplaying">Book</div>
      
      <div class="turntable">
        <div class="record">
          <div class="recordcenter">
            <img src="cover.jpg" alt="Book Cover">
          </div>
        </div>

        <div class="tonearm">
          <div class="tonearm-base"></div>
          <div class="tonearmstick">
            <div class="tonearmhead"></div>
          </div>
        </div>
      </div>

      <div class="progress">
        <input type="range" class="progressbar" value="30" min="0" max="100">
        <div class="timestamps">
          <span>00:00</span>
          <span>45:00</span>
        </div>
      </div>

      <select class="chapterselect">
        <option>Chapter 1</option>
        <option>Chapter 2</option>
        <option>Chapter 3</option>
      </select>

      <div class="controls">
        <button>Start</button>
        <button>Stop</button>
        <button>1x</button>
      </div>
    </div>

    <div class="library">
      <h3>Select Audio</h3>
      <input type="text" class="search-bar" placeholder="Search audiobooks...">

      <div class="booklist">
        <div class="bookitem">
          <div class="bookinfo">Book 1</div>
          <button class="favbtn">☆</button>
        </div>
        <div class="bookitem">
          <div class="bookinfo">Book 2</div>
          <button class="favbtn">☆</button>
        </div>
        <div class="bookitem">
          <div class="bookinfo">Book 3</div>
          <button class="favbtn">☆</button>
        </div>
        <div class="bookitem">
          <div class="bookinfo">Book 4</div>
          <button class="favbtn">☆</button>
        </div>
        <div class="bookitem">
          <div class="bookinfo">Book 5</div>
          <button class="favbtn">☆</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
