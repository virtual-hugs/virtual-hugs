<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules and Guidelines</title>
    <style>
        nav {
            background-color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            width: 98%;
        }
        .logoimg {
            width: 35px; 
            height: 35px;
            object-fit: contain;
            margin-right: 10px;
        }
        .title {
            font-weight: bold;
            color: #ffffff;
            margin-right: auto;
        }
        .navlinks {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }
        .navlinks a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s;
        }
         .navlinks a:hover {
      color: #1d61b9;
    }
    h1 {
      text-align: center;
      margin-top: 2rem;
      font-size: 2rem;
    }
    body {
        background-color: #f7f3ee;
        color: #4a403a;
        justify-content: flex-start;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
    }
    .journalpage {
        background: #fffdfa;
        width: 85%;
        max-width: 650px;
        margin-top: 40px;
        padding: 40px 40px 40px 70px;
        box-shadow:  2px 4px 15px rgba(0,0,0,0,26);
        border-radius: 4px;
        position: relative;
        background-image: repeating-linear-gradient(transparent, transparent 31px, #f2e9e1 31px, #f2e9e1 32px);
        border-left: 3px solid #e0afa0
    }
    .journalpage::before {
        content: "";
        position: absolute;
        left: 45px;
        top: 0;
        bottom: 0;
        width: 2px;
        background-color: #f08080;
        opacity: 0.5;
    }
    .date {
        font-size: 16px;
        color: #a38173;
        margin-bottom: 25px;
    }
    .signature {
        font-size: 28px;
        color: #8c5844;
        margin-top: 30px;
        text-align: right;
    }
    </style>
</head>
<body>
     <nav>
    <img src = "" alt="logo" class="logoimg">
    <span class="title">Virtual Hugs</span>
    <ul class="navlinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">Kindness Wall</a></li>
        <li><a href="#">Minigames</a></li>
        <li><a href="#">Audiobooks</a></li>
        <li><a href="#">Guildlines</a></li>
        <li><a href="#">Affirmations</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Breathing Exercises & Mindfulness</a></li>
    </ul>
  </nav>
  <div class="journalpage">
    <h1>Rules and Guidelines</h1>
    <div class="date">entry #01 - lorem ipsum journal entry style</div>
    <p>you better follow them rules blah blah blah</p>
    <div class="signature">with love, virtual hugs team</div>
  </div>
</body>
</html>
